<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Rock Paper Scissors ✊✋✌️</h1>
    <p class="subtitle">First to 5 wins!</p>

    <!-- Score Board -->
    <div class="scoreboard">
      <div>You: <span id="userScore">0</span></div>
      <div>Computer: <span id="computerScore">0</span></div>
    </div>

    <!-- Result Display -->
    <div id="result">Make your move</div>

    <!-- Choice Buttons -->
    <div class="choices">
      <button class="choice" data-choice="rock">
        <div class="emoji">✊</div>
        <span>Rock</span>
      </button>
      <button class="choice" data-choice="paper">
        <div class="emoji">✋</div>
        <span>Paper</span>
      </button>
      <button class="choice" data-choice="scissors">
        <div class="emoji">✌️</div>
        <span>Scissors</span>
      </button>
    </div>

    <!-- Show what both picked -->
    <div class="battle">
      <div>You picked: <span id="userChoice">-</span></div>
      <div>Computer picked: <span id="computerChoice">-</span></div>
    </div>

    <button class="reset" onclick="resetGame()">Reset Game</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
